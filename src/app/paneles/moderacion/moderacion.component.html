<div class="container">
  <h2>Gestión de Usuarios</h2>

  <div class="layout">

    <!-- TABLA -->
    <div class="tabla">
      <div class="card">
        <h3>Lista de Usuarios</h3>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Rol</th>
                <th>Fecha registro</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let u of usuariosPaginados">
                <td>{{ u.email }}</td>
                <td>{{ u.nombre }}</td>
                <td>{{ u.apellido }}</td>
                <td>{{ u.id_rol }}</td>
                <td>{{ u.fecha_registro }}</td>

                <td class="actions">

                  <button class="icon-btn edit"
                          (click)="editarUsuario(u)"
                          matTooltip="Editar">
                    <mat-icon>edit</mat-icon>
                  </button>

                  <button class="icon-btn delete"
                          (click)="eliminarUsuario(u.uid)"
                          matTooltip="Eliminar">
                    <mat-icon>delete</mat-icon>
                  </button>

                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- PAGINACIÓN -->
        <div class="paginacion">
          <button (click)="anteriorPagina()" [disabled]="paginaActual === 1">⬅</button>
          <span>Página {{ paginaActual }} de {{ totalPaginas() }}</span>
          <button (click)="siguientePagina()" [disabled]="paginaActual === totalPaginas()">➡</button>
        </div>

      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">

      <!-- BOTÓN CREAR -->
      <button class="btn primary" (click)="toggleCrear()" matTooltip="Crear usuario">
        <mat-icon>person_add</mat-icon>
      </button>

      <!-- FORMULARIO -->
      <div class="formulario card" *ngIf="mostrarCrear">

        <h3>Crear Usuario</h3>

        <div class="form-grid">
          <input [(ngModel)]="nuevoUsuario.uid" placeholder="UID">
          <input [(ngModel)]="nuevoUsuario.email" placeholder="Email">
          <input [(ngModel)]="nuevoUsuario.nombre" placeholder="Nombre">
          <input [(ngModel)]="nuevoUsuario.apellido" placeholder="Apellido">
          <input [(ngModel)]="nuevoUsuario.id_rol" type="number" placeholder="Rol">
        </div>

        <div class="actions">
          <button class="btn primary" (click)="crearUsuario()">Crear</button>
          <button class="btn cancel" (click)="toggleCrear()">Cancelar</button>
        </div>

      </div>

      <!-- EDITAR -->
      <div class="editar card" *ngIf="usuarioEditando">

        <h3>Editar Usuario</h3>

        <div class="form-grid">
          <input [(ngModel)]="usuarioEditando.email" placeholder="Email">
          <input [(ngModel)]="usuarioEditando.nombre" placeholder="Nombre">
          <input [(ngModel)]="usuarioEditando.apellido" placeholder="Apellido">
          <input [(ngModel)]="usuarioEditando.id_rol" type="number" placeholder="Rol">
        </div>

        <div class="actions">
          <button class="btn primary" (click)="actualizarUsuario()">Guardar</button>
          <button class="btn cancel" (click)="cancelarEdicion()">Cancelar</button>
        </div>

      </div>

    </div>

  </div>
</div>
